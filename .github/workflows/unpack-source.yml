name: Unpack PaperBench source

on:
  push:
    branches: [macos-app]
    paths:
      - ".paperbench-src/**"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and expand source bundle
        shell: bash
        run: |
          cat .paperbench-src/part-* | tr -d '\n' | base64 --decode > /tmp/PaperBench-macOS-source.zip
          unzip -t /tmp/PaperBench-macOS-source.zip
          unzip -q -o /tmp/PaperBench-macOS-source.zip -d .
          rm -rf .paperbench-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PaperBench macOS app and embedded backend"
          git push origin HEAD:macos-app
