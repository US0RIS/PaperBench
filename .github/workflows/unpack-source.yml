name: Unpack PaperBench source

on:
  push:
    branches: [macos-app]
    paths:
      - PaperBench-macOS-source.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source bundle
        shell: bash
        run: |
          if [ ! -f PaperBench-macOS-source.zip ]; then
            exit 0
          fi
          unzip -q -o PaperBench-macOS-source.zip -d .
          rm PaperBench-macOS-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add PaperBench macOS app and embedded backend"
          git push origin HEAD:macos-app
