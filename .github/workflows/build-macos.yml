name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
        continue-on-error: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test embedded backend
        run: npm run test:backend

      - name: Build renderer
        run: npm run build

      - name: Package macOS app
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Verify app signature
        shell: bash
        run: |
          APP="$(find release -type d -name 'PaperBench.app' -print -quit)"
          test -n "$APP"
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/codesign.txt
          grep -q "Signature=adhoc" /tmp/codesign.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PaperBench-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
